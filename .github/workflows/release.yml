name: release
'on':
  push:
    tags:
    - v*
permissions:
  contents: write
jobs:
  build-macos-arm64:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --release -p mcode-cli
    - name: Package
      run: 'mkdir -p stage

        cp target/release/mcode stage/mcode

        tar -czf mcode-${{ github.ref_name }}-macos-arm64.tar.gz -C stage mcode

        '
    - uses: actions/upload-artifact@v4
      with:
        name: mcode-aarch64-apple-darwin
        path: mcode-${{ github.ref_name }}-macos-arm64.tar.gz
        if-no-files-found: error
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install musl tools
      run: sudo apt-get update && sudo apt-get install -y musl-tools
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --release -p mcode-cli --target x86_64-unknown-linux-musl
    - name: Package
      run: 'mkdir -p stage

        cp target/x86_64-unknown-linux-musl/release/mcode stage/mcode

        tar -czf mcode-${{ github.ref_name }}-linux-x86_64.tar.gz -C stage mcode

        '
    - uses: actions/upload-artifact@v4
      with:
        name: mcode-x86_64-linux-musl
        path: mcode-${{ github.ref_name }}-linux-x86_64.tar.gz
        if-no-files-found: error
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - name: Install musl tools
      run: sudo apt-get update && sudo apt-get install -y musl-tools
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-unknown-linux-musl
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --release -p mcode-cli --target aarch64-unknown-linux-musl
    - name: Package
      run: 'mkdir -p stage

        cp target/aarch64-unknown-linux-musl/release/mcode stage/mcode

        tar -czf mcode-${{ github.ref_name }}-linux-arm64.tar.gz -C stage mcode

        '
    - uses: actions/upload-artifact@v4
      with:
        name: mcode-aarch64-linux-musl
        path: mcode-${{ github.ref_name }}-linux-arm64.tar.gz
        if-no-files-found: error
  build-windows-x64:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --release -p mcode-cli
    - name: Package
      run: 'mkdir stage -Force

        Copy-Item target/release/mcode.exe stage/mcode.exe

        Compress-Archive -Path stage/mcode.exe -DestinationPath mcode-${{ github.ref_name
        }}-windows-x86_64.zip -Force

        '
      shell: pwsh
    - uses: actions/upload-artifact@v4
      with:
        name: mcode-x86_64-windows-msvc
        path: mcode-${{ github.ref_name }}-windows-x86_64.zip
        if-no-files-found: error
  publish:
    needs:
    - build-macos-arm64
    - build-linux-x64
    - build-linux-arm64
    - build-windows-x64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: Attach to GitHub Release
      run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
