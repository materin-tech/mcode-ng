name: ci
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
    - run: cargo fmt --all -- --check
    - run: cargo clippy --workspace --exclude mcode-ui --all-targets -- -D warnings
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-latest
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: cargo test --workspace (unix)
      if: runner.os != 'Windows'
      run: cargo test --workspace --exclude mcode-ui
    - name: cargo test --workspace (windows, per-binary timeout)
      if: runner.os == 'Windows'
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n# 编译期单独可见（这一步可能占大头；job 能完成，缓存才落得下）\n\
        cargo test --workspace --exclude mcode-ui --no-run\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE\
        \ }\n# 抓测试二进制清单（增量，秒回）\n$bins = cargo test --workspace --exclude mcode-ui --no-run --message-format=json\
        \ 2>$null |\n  Where-Object { $_.StartsWith('{') } | ForEach-Object { $_ | ConvertFrom-Json\
        \ } |\n  Where-Object { $_.executable -and $_.profile.test } |\n  Select-Object\
        \ -Unique -ExpandProperty executable\nWrite-Host \"test binaries: $($bins.Count)\"\
        \n# 逐二进制跑：单个 8 分钟封顶，超时即杀进程树并让 job 变红点名\nforeach ($b in $bins) {\n  Write-Host\
        \ \">>> RUNNING $b\"\n  $so = New-TemporaryFile; $se = New-TemporaryFile\n\
        \  $p = Start-Process -FilePath $b -ArgumentList '--test-threads=2' -NoNewWindow\
        \ -PassThru `\n        -RedirectStandardOutput $so.FullName -RedirectStandardError\
        \ $se.FullName\n  if (-not $p.WaitForExit(480000)) {\n    try { $p.Kill($true)\
        \ } catch { $p.Kill() }\n    Write-Host \"!!! TIMEOUT(8min): $b\"\n    Write-Host\
        \ '--- stdout ---'; Get-Content $so.FullName | ForEach-Object { Write-Host\
        \ $_ }\n    Write-Host '--- stderr ---'; Get-Content $se.FullName | ForEach-Object\
        \ { Write-Host $_ }\n    exit 1\n  }\n  Get-Content $so.FullName | ForEach-Object\
        \ { Write-Host $_ }\n  Get-Content $se.FullName | ForEach-Object { Write-Host\
        \ $_ }\n  if ($p.ExitCode -ne 0) { exit $p.ExitCode }\n}\nWrite-Host 'ALL\
        \ BINARIES DONE'\n"
  desktop:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: clippy (mcode-ui)
      run: cargo clippy -p mcode-ui --all-targets -- -D warnings
    - name: test (mcode-ui)
      run: cargo test -p mcode-ui
    - name: build release (mcode-ui)
      run: cargo build --release -p mcode-ui
    - uses: actions/upload-artifact@v4
      with:
        name: MCode_Desktop-aarch64-apple-darwin
        path: target/release/MCode_Desktop
  build-macos-arm64:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo build --release -p mcode-cli
    - uses: actions/upload-artifact@v4
      with:
        name: mcode-aarch64-apple-darwin
        path: target/release/mcode
  build-linux-x64-musl:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get update && sudo apt-get install -y musl-tools
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl
    - uses: Swatinem/rust-cache@v2
    - run: cargo build --release -p mcode-cli --target x86_64-unknown-linux-musl
    - uses: actions/upload-artifact@v4
      with:
        name: mcode-x86_64-linux-musl
        path: target/x86_64-unknown-linux-musl/release/mcode
  build-linux-arm64-musl:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get update && sudo apt-get install -y musl-tools
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-unknown-linux-musl
    - uses: Swatinem/rust-cache@v2
    - run: cargo build --release -p mcode-cli --target aarch64-unknown-linux-musl
    - uses: actions/upload-artifact@v4
      with:
        name: mcode-aarch64-linux-musl
        path: target/aarch64-unknown-linux-musl/release/mcode
  build-windows-x64:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo build --release -p mcode-cli
    - uses: actions/upload-artifact@v4
      with:
        name: mcode-x86_64-windows-msvc
        path: target/release/mcode.exe
'on':
  push:
    branches:
    - main
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
